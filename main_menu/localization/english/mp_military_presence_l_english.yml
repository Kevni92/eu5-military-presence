l_english:
 mp_military_patrol: "Military Patrol"
 mp_military_patrol_desc: "Assign this army to its configured virtual patrol route. Each month it builds Military Presence in its current patrol province. At 90 Military Presence it advances to the next configured province."

 mp_add_patrol_province: "Add Military Patrol Province"
 mp_add_patrol_province_desc: "Append a province to an army's virtual Military Patrol route. Provinces are visited in the order they were added and the route loops after the final province."
 mp_add_patrol_province_select_army: "Select Patrol Army"
 mp_add_patrol_province_select_province: "Select Province to Append"
 mp_no_available_armies: "There are no available armies."
 mp_no_available_patrol_provinces: "There are no eligible fully owned provinces that are not already in this army's patrol route."

 mp_clear_patrol_route: "Clear Military Patrol Route"
 mp_clear_patrol_route_desc: "Remove every configured province from an army's Military Patrol route and stop its virtual patrol assignment."
 mp_clear_patrol_route_select_army: "Select Patrol Route to Clear"
 mp_no_patrol_routes: "No army has a configured Military Patrol route."

 mp_military_presence_modifier: "Military Presence"
 mp_military_presence_modifier_desc: "Military forces assigned to patrol this province suppress unrest and help state control recover. The effect scales with Military Presence."
