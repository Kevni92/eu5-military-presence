l_german:
 mp_military_patrol: "Militärpatrouille"
 mp_military_patrol_desc: "Weist eine Armee ihrer konfigurierten virtuellen Patrouillenroute zu. Jeden Monat erhöht sie die Militärpräsenz in ihrer aktuellen Patrouillenprovinz. Bei 90 Militärpräsenz wechselt sie zur nächsten konfigurierten Provinz."

 mp_edit_patrol_route: "Patrouillenroute bearbeiten"
 mp_edit_patrol_route_desc: "Öffnet den Routen-Editor für eine Armee. Mehrere vollständig eigene Provinzen können in einem Arbeitsgang hinzugefügt oder entfernt werden. Änderungen werden erst mit Übernehmen auf die echte Route angewandt."
 mp_edit_patrol_route_select_army: "Patrouillenarmee auswählen"
 mp_edit_patrol_route_select_provinces: "Patrouillenprovinzen auswählen"
 mp_no_available_armies: "Es sind keine geeigneten Armeen verfügbar."
 mp_no_available_patrol_provinces: "Es gibt keine geeigneten vollständig eigenen Provinzen für diese Patrouillenroute."

 mp_patrol_editor_title: "Patrouillenroute bearbeiten"
 mp_patrol_editor_instructions: "Klick auf die Karte fügt eine Provinz hinzu; das Häkchen schaltet sie ein oder aus.\nShift + Häkchen: ganze Region · Strg + Häkchen: ganze Area."
 mp_patrol_editor_toggle_tt: "Provinz in der Patrouillenroute ein- oder ausschließen."
 mp_patrol_editor_map_tt: "Klick auf eine vollständig eigene Provinz fügt sie der Arbeitsroute hinzu. Ausgewählte Provinzen werden grün-gold gestreift dargestellt."
 mp_patrol_editor_add_region_tt: "Shift-Klick: Alle vollständig eigenen Provinzen dieser Region hinzufügen."
 mp_patrol_editor_add_area_tt: "Strg-Klick: Alle vollständig eigenen Provinzen dieser Area hinzufügen."
 mp_patrol_editor_select_all: "Alle auswählen"
 mp_patrol_editor_select_all_tt: "Fügt alle vollständig eigenen Provinzen des Landes zur Arbeitsroute hinzu."
 mp_patrol_editor_clear: "Auswahl leeren"
 mp_patrol_editor_clear_tt: "Entfernt alle Provinzen aus der Arbeitskopie. Die echte Route wird erst durch Übernehmen geändert."
 mp_patrol_editor_cancel: "Abbrechen"
 mp_patrol_editor_apply: "Übernehmen"
 mp_patrol_editor_apply_tt: "Ersetzt die bestehende Patrouillenroute durch die aktuell ausgewählten Provinzen. Eine leere Auswahl löscht die Route."

 mp_start_military_patrol: "Militärpatrouille beginnen"
 mp_start_military_patrol_desc: "Weist eine Armee mit konfigurierter Patrouillenroute dem Militärpatrouillendienst zu."
 mp_start_military_patrol_select_army: "Armee für Militärpatrouille auswählen"
 mp_no_configured_patrol_armies: "Keine inaktive Armee besitzt eine konfigurierte Militärpatrouillenroute."

 mp_stop_military_patrol: "Militärpatrouille beenden"
 mp_stop_military_patrol_desc: "Beendet den Militärpatrouillendienst einer Armee, ohne ihre konfigurierte Route zu löschen."
 mp_stop_military_patrol_select_army: "Zu beendende Militärpatrouille auswählen"
 mp_no_active_patrol_armies: "Derzeit ist keine Armee dem Militärpatrouillendienst zugewiesen."

 mp_military_presence_modifier: "Militärpräsenz"
 mp_military_presence_modifier_desc: "Der Provinz zugewiesene Militärkräfte unterdrücken Unruhe und stärken die staatliche Kontrolle. Der Effekt skaliert mit der Militärpräsenz; bei 100 Präsenz gewährt er +10 % maximale Kontrolle."
 STATIC_MODIFIER_NAME_mp_military_presence_modifier: "Militärpräsenz"

 game_concept_mp_military_presence: "Militärpräsenz"
 game_concept_mp_military_presence_desc: "Ein Provinzwert von 0 bis 100, der die dauerhafte militärische Durchsetzung staatlicher Ordnung abbildet. Patrouillierende Armeen bauen Militärpräsenz entlang ihrer konfigurierten Routen auf."
 mapmode_mp_military_presence_name: "Militärpräsenz"
 MAPMODE_MP_MILITARY_PRESENCE: "#T $mapmode_mp_military_presence_name$#!\nFärbt alle Locations einer Provinz anhand der Militärpräsenz dieser Provinz. Rot steht für geringe, Grün für hohe Präsenz. Goldene Streifen markieren Provinzen, denen aktuell eine Armee zum Aufbau von Militärpräsenz zugewiesen ist."
 MAPMODE_MP_MILITARY_PRESENCE_NONE: "Keine Militärpräsenz"
 MAPMODE_MP_MILITARY_PRESENCE_LOW: "Geringe Militärpräsenz"
 MAPMODE_MP_MILITARY_PRESENCE_HIGH: "Hohe Militärpräsenz"
 MAPMODE_MP_MILITARY_PRESENCE_ASSIGNED: "Aktiver Armeeaufbau (gestreift)"
 MAPMODE_MP_MILITARY_PRESENCE_TT: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V [ROOT.GetLocation.MakeScope.GetVariable('mp_military_presence_map_value').GetValue|0]#! / 100"
 MAPMODE_MP_MILITARY_PRESENCE_TT_NONE: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V 0#! / 100"
 MAPMODE_MP_MILITARY_PRESENCE_TT_ASSIGNED: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V [ROOT.GetLocation.MakeScope.GetVariable('mp_military_presence_map_value').GetValue|0]#! / 100\n#Y Eine Armee baut hier aktuell Militärpräsenz auf.#!"
 MAPMODE_MP_MILITARY_PRESENCE_TT_ASSIGNED_NONE: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V 0#! / 100\n#Y Eine Armee ist dieser Provinz aktuell zum Aufbau von Militärpräsenz zugewiesen.#!"
