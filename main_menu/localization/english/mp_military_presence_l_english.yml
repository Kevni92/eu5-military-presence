l_english:
 mp_military_patrol: "Military Patrol"
 mp_military_patrol_desc: "Assign an army to its configured virtual patrol route. Each month it builds Military Presence in its current patrol province. At 90 Military Presence it advances to the next configured province."

 mp_edit_patrol_route: "Edit Military Patrol Route"
 mp_edit_patrol_route_desc: "Open the route editor for an army. Multiple fully owned provinces can be added or removed in one editing session. Changes are not committed to the live route until Apply is pressed."
 mp_edit_patrol_route_select_army: "Select Patrol Army"
 mp_edit_patrol_route_select_provinces: "Select Patrol Provinces"
 mp_no_available_armies: "There are no available armies."
 mp_no_available_patrol_provinces: "There are no eligible fully owned provinces for this patrol route."

 mp_patrol_editor_title: "Edit Military Patrol Route"
 mp_patrol_editor_instruction_click: "Map: add province · Checkbox: select/deselect"
 mp_patrol_editor_instruction_modifiers: "On checkbox: Shift = Region · Ctrl = Area"
 mp_patrol_editor_toggle_tt: "Include or exclude this province from the patrol route."
 mp_patrol_editor_map_tt: "Click a fully owned province to add it to the working route. Selected provinces are shown with green and gold stripes."
 mp_patrol_editor_add_region_tt: "Shift-click the checkbox: Add every fully owned province in this Region."
 mp_patrol_editor_add_area_tt: "Ctrl-click the checkbox: Add every fully owned province in this Area."
 mp_patrol_editor_select_all: "Select All"
 mp_patrol_editor_select_all_tt: "Add every fully owned province in the country to the working route."
 mp_patrol_editor_clear: "Clear Selection"
 mp_patrol_editor_clear_tt: "Remove every province from the working copy. The live route changes only after Apply."
 mp_patrol_editor_cancel: "Cancel"
 mp_patrol_editor_apply: "Apply"
 mp_patrol_editor_apply_tt: "Replace the existing patrol route with the currently selected provinces. An empty selection deletes the route."

 mp_start_military_patrol: "Start Military Patrol"
 mp_start_military_patrol_desc: "Assign an army with a configured patrol route to Military Patrol duty."
 mp_start_military_patrol_select_army: "Select Army for Military Patrol"
 mp_no_configured_patrol_armies: "No inactive army has a configured Military Patrol route."

 mp_stop_military_patrol: "Stop Military Patrol"
 mp_stop_military_patrol_desc: "End Military Patrol duty for an army without deleting its configured route."
 mp_stop_military_patrol_select_army: "Select Military Patrol to Stop"
 mp_no_active_patrol_armies: "No army is currently assigned to Military Patrol duty."

 mp_military_presence_modifier: "Military Presence"
 mp_military_presence_modifier_desc: "Military forces assigned to patrol this province suppress unrest and strengthen state control. The effect scales with Military Presence; at 100 Presence it grants +10% maximum Control."
 STATIC_MODIFIER_NAME_mp_military_presence_modifier: "Military Presence"

 game_concept_mp_military_presence: "Military Presence"
 game_concept_mp_military_presence_desc: "A province-level value from 0 to 100 representing sustained military enforcement. Patrol armies build Military Presence on their configured routes."
 mapmode_mp_military_presence_name: "Military Presence"
 MAPMODE_MP_MILITARY_PRESENCE: "#T $mapmode_mp_military_presence_name$#!\nColors every location of a province by that province's Military Presence. Red is low presence and green is high presence. Gold stripes mark provinces currently assigned an army that is building Military Presence there."
 MAPMODE_MP_MILITARY_PRESENCE_NONE: "No Military Presence"
 MAPMODE_MP_MILITARY_PRESENCE_LOW: "Low Military Presence"
 MAPMODE_MP_MILITARY_PRESENCE_HIGH: "High Military Presence"
 MAPMODE_MP_MILITARY_PRESENCE_ASSIGNED: "Active army assignment (striped)"
 MAPMODE_MP_MILITARY_PRESENCE_TT: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V [ROOT.GetLocation.MakeScope.GetVariable('mp_military_presence_map_value').GetValue|0]#! / 100"
 MAPMODE_MP_MILITARY_PRESENCE_TT_NONE: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V 0#! / 100"
 MAPMODE_MP_MILITARY_PRESENCE_TT_ASSIGNED: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V [ROOT.GetLocation.MakeScope.GetVariable('mp_military_presence_map_value').GetValue|0]#! / 100\n#Y An army is currently building Military Presence here.#!"
 MAPMODE_MP_MILITARY_PRESENCE_TT_ASSIGNED_NONE: "#T $mapmode_mp_military_presence_name$#!\n[ROOT.GetLocation.GetName]: #V 0#! / 100\n#Y An army is currently assigned to build Military Presence in this province.#!"
